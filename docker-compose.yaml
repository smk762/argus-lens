services:
  argus-lens:
    build: .
    ports:
      - "${ARGUS_PORT:-8080}:8080"
    environment:
      - ARGUS_BACKEND=${ARGUS_BACKEND:-hybrid}
      # Cloud backends each read their own key variable.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - ARGUS_OPENAI_COMPAT_BASE_URL=${ARGUS_OPENAI_COMPAT_BASE_URL:-}
      - ARGUS_OPENAI_COMPAT_MODEL=${ARGUS_OPENAI_COMPAT_MODEL:-}
      - ARGUS_OPENAI_COMPAT_API_KEY=${ARGUS_OPENAI_COMPAT_API_KEY:-}
      - ARGUS_OPENAI_COMPAT_PROMPT=${ARGUS_OPENAI_COMPAT_PROMPT:-}
      - WD14_MODEL_REPO=${WD14_MODEL_REPO:-}
      # LLM refinement of assembled captions (unset ARGUS_REFINE_MODEL = off).
      - ARGUS_REFINE_MODEL=${ARGUS_REFINE_MODEL:-}
      - ARGUS_REFINE_BASE_URL=${ARGUS_REFINE_BASE_URL:-}
      - ARGUS_REFINE_API_KEY=${ARGUS_REFINE_API_KEY:-}
      - ARGUS_REFINE_VARIANTS=${ARGUS_REFINE_VARIANTS:-}
      # Share the GPU politely with ComfyUI etc. on the same host.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-none}
      - ARGUS_IDLE_UNLOAD_S=${ARGUS_IDLE_UNLOAD_S:-}
      - WD14_MODEL_DIR=/root/.cache/wd14_tagger
      - HF_HOME=/root/.cache/huggingface
      - HF_TRUST_REMOTE_CODE=${HF_TRUST_REMOTE_CODE:-false}
    volumes:
      # Writable so a new WD14_MODEL_REPO can download into its own subdir.
      - ~/.cache/wd14_tagger:/root/.cache/wd14_tagger
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
