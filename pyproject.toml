[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-lens"
dynamic = ["version"]
description = "Intent-aware, multi-model captioning pipeline for LoRA training, dataset curation, and generative AI workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
keywords = [
    "captioning", "image", "lora", "training", "diffusion",
    "florence", "wd14", "blip", "dataset", "structured-captions",
    "stable-diffusion", "flux", "sdxl", "annotation", "tagging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    # httpx verifies against certifi. 2026.10.19 drops emSign ECC Root CA - G3
    # (discuss.python.org/t/109576) and keeps the unaffected emSign roots.
    "certifi>=2026.10.19",
    "Pillow>=10.0",
    "structlog>=24.0",
    "httpx>=0.27",
    # argus_cortex.xmp (sidecars, shared with argus-curator) and argus_cortex.gpu
    # (the host-wide GPU lease). Capped below 0.5: cortex is pre-1.0, where a
    # minor bump may break.
    "argus-cortex>=0.4.3,<0.5",
]

[project.optional-dependencies]
wd14 = ["onnxruntime>=1.16", "numpy>=1.24"]
wd14-gpu = ["onnxruntime-gpu>=1.16", "numpy>=1.24", "argus-cortex[gpu]>=0.4.3,<0.5"]
torch = ["torch>=2.1", "transformers>=4.46", "safetensors>=0.4", "argus-cortex[gpu]>=0.4.3,<0.5"]
local = ["onnxruntime>=1.16", "numpy>=1.24", "torch>=2.1", "transformers>=4.46", "safetensors>=0.4", "argus-cortex[gpu]>=0.4.3,<0.5"]
openai = ["openai>=1.30"]
replicate = ["replicate>=0.25"]
replay = ["psycopg[binary]>=3.1"]
cli = ["typer>=0.12", "rich>=13.0"]
eval = ["torch>=2.1", "transformers>=4.46"]
# argus-cortex[server]: the shared cross-site write guard (argus_cortex.server).
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.7", "argus-cortex[server]>=0.4.3,<0.5"]
all = [
    "argus-cortex[gpu]>=0.4.3,<0.5",
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.46",
    "safetensors>=0.4",
    "openai>=1.30",
    "replicate>=0.25",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "argus-cortex[server]>=0.4.3,<0.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.7",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.16", "interrogate>=1.7", "httpx2>=2.7"]

[project.scripts]
argus-lens = "argus_lens.cli:app"

[project.urls]
Homepage = "https://github.com/smk762/argus-lens"
Repository = "https://github.com/smk762/argus-lens"
Issues = "https://github.com/smk762/argus-lens/issues"
Changelog = "https://github.com/smk762/argus-lens/blob/main/CHANGELOG.md"

[tool.uv]
# 0.13.4 removed the compromised emSign root from uv's own trust store.
# 0.13.5 also ships CPython builds whose bundled pip is 26.2.2.
required-version = ">=0.13.5"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_lens/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.interrogate]
fail-under = 80
exclude = ["src/argus_lens/_version.py"]
verbose = 1

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_lens/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
